{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>Single Student Prediction</h2>
    <p>Enter study habits to predict marks</p>

    <form method="POST">
        <input name="student" placeholder="Student Name" required>

        <input name="StudyHours" type="number" step="0.1" placeholder="Study Hours" required>
        <input name="PlayHours" type="number" step="0.1" placeholder="Play Hours" required>
        <input name="SleepHours" type="number" step="0.1" placeholder="Sleep Hours" required>
        <input name="SocialMedia" type="number" step="0.1" placeholder="Social Media Hours" required>
        <input name="Exercise" type="number" step="0.1" placeholder="Exercise Hours" required>
        <input name="AttentionLevel" type="number" step="0.1" placeholder="Attention Level (1–10)" required>

        <button type="submit">Predict Marks</button>
    </form>
</div>

{% endblock %}
